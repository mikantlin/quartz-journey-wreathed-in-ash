name: Update vault content

on:
  repository_dispatch:
    types: vault-updated
  workflow_dispatch:

jobs:
  update_vault_content:
    runs-on: ubuntu-latest
    steps:    
      - name: Clone mikantlin/journey-wreathed-in-ash-private
        uses: actions/checkout@v4.2.2
        with:
          repository: "mikantlin/journey-wreathed-in-ash-private"
          ref: master
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          path: journey-wreathed-in-ash-private

      - name: Clone this repo
        uses: actions/checkout@v4.2.2
        with:
          ref: v4
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          path: journey-wreathed-in-ash-quartz

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci
        working-directory: ./journey-wreathed-in-ash-quartz
    
      - name: Run tests
        run: npm test
        working-directory: ./journey-wreathed-in-ash-quartz

      - name: Delete everything in content/ except index.md
        run: |
          cd journey-wreathed-in-ash-quartz
          mv content/index.md .
          rm -rf content
          mkdir content
          mv index.md content

      - name: Copy over media and files
        run: |
          cd journey-wreathed-in-ash-private
          echo "----- Copying over public-only attachments"
          cp -vr _attachments ../journey-wreathed-in-ash-quartz/content
          echo -e "\n----- Copying over Markdown files"
          cp -vr campaign_notes/. ../journey-wreathed-in-ash-quartz/content
          cd ../journey-wreathed-in-ash-quartz/content
          mv _attachments _files
        # ^ Include this last line if you want to rename your public folder

      - name: Print out current state of filesystem
        run: |
          echo "----- Folder: journey-wreathed-in-ash-quartz/"
          cd journey-wreathed-in-ash-quartz
          ls | cat
          echo -e "\n----- Folder: journey-wreathed-in-ash-quartz/content/"
          ls content | cat
          echo -e "\n----- Folder: journey-wreathed-in-ash-quartz/content/_files"
          ls content/_files | cat
        # ^ NOTE: this uses the renamed folder name from above

      - name: Setup Git config (user and email), necessary for commits
        run: |
          git config --global user.name "Porter Robinson"
          git config --global user.email "hello@example.com"

      - name: Sync Quartz repo
        run: |
          cd journey-wreathed-in-ash-quartz
          npx quartz sync
